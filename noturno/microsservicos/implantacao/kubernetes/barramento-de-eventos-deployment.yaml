apiVersion: apps/v1
kind: Deployment
metadata:
  name: barramento-de-eventos-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barramento-de-eventos
  template:
    metadata:
      labels:
        app: barramento-de-eventos
    spec:
      containers:
        - name: barramento-de-eventos
          image: mamazzei/barramento-de-eventos
          ports:
            - containerPort: 10000
          imagePullPolicy: IfNotPresent # Never ou Always
          resources:
            limits:
              memory: "256Mi"
              cpu: 500m